<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>調合所</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="game-container">

    <header class="game-header">
      <h1 class="game-title">調合所</h1>
      <p class="game-subtitle">草木と鉱物の覚え書き</p>
    </header>

    <main class="game-main">

      <!-- ── 左：素材 ── -->
      <section id="panel-items">
        <h2 class="column-title">素材</h2>

        <div class="item-tools">
          <input type="search" id="item-search" class="item-search"
                 placeholder="名前で探す" aria-label="素材を名前で探す" />
          <div class="filter-btns" id="item-filters" role="group" aria-label="種別で絞る"></div>
        </div>

        <ul class="item-list" id="item-list"></ul>
        <p class="column-note">棚に <span id="item-total">0 種</span></p>
      </section>

      <!-- ── 中央：調合台 ── -->
      <section id="panel-workspace">
        <h2 class="column-title">調合台</h2>

        <div class="ingredient-slots" id="ingredient-slots"></div>

        <div class="vessel-area">
          <div class="vessel-row">
            <span class="vessel-label">器</span>
            <div class="vessel-btns" role="group" aria-label="器を選ぶ">
              <button class="vessel-btn active" data-vessel="">使わない</button>
              <button class="vessel-btn" data-vessel="item_175">
                薬瓶<span class="vessel-count">0</span>
              </button>
              <button class="vessel-btn" data-vessel="item_088">
                ガラス瓶<span class="vessel-count">0</span>
              </button>
            </div>
          </div>
          <p class="vessel-hint">液体は薬瓶に、気体はガラス瓶に納めなければ形を保てない。</p>
        </div>

        <div class="compound-area">
          <button class="btn-compound" id="btn-compound">調合する</button>
          <button class="btn-reset" id="btn-reset">やり直す</button>
        </div>
      </section>

      <!-- ── 右：覚え書き → 解いた調合 → 結果 ── -->
      <section id="panel-notes">

        <div class="right-section">
          <h2 class="column-title">覚え書き<span class="rb-count" id="slip-count">0 枚</span></h2>

          <div class="slip-tools">
            <div class="filter-btns" id="slip-filters" role="group" aria-label="出所で絞る"></div>
          </div>
          <ul class="slip-index" id="slip-index"></ul>

          <div class="memo-sheet" id="memo-sheet"></div>
        </div>

        <div class="right-section">
          <h2 class="column-title">解いた調合<span class="rb-count" id="recipe-count">0 / 0</span></h2>
          <div class="rb-body" id="recipe-book"></div>
        </div>

        <div class="right-section">
          <h2 class="column-title">結果</h2>
          <div class="result-panel" id="result-display">

            <div class="result-state" id="state-waiting">
              <p class="result-sub-text">素材と工程、そして器を選び、<br>調合を試みる。</p>
            </div>

            <div class="result-state hidden" id="state-success">
              <p class="result-badge">できあがった</p>
              <p class="result-product-name" id="result-product-name"></p>
              <p class="result-product-desc" id="result-product-desc"></p>
            </div>

            <div class="result-state hidden" id="state-failure">
              <p class="result-badge failure-badge">しくじった</p>
              <p class="result-sub-text">素材が濁り合い、<br>名の付けようがないものになった。</p>
            </div>

          </div>
        </div>

      </section>

    </main>

    <footer class="game-footer">
      <span><span class="footer-key">素材</span>押して出し入れ</span>
      <span><span class="footer-key">工程</span>素材ごとに決める</span>
      <span><span class="footer-key">器</span>剤形に合わせる</span>
      <span><span class="footer-key">覚え書き</span>素材や調合を押すと出る</span>
    </footer>

  </div>

  <script src="data_categories.js"></script>
  <script src="data_effects.js"></script>
  <script src="data_processes.js"></script>
  <script src="data_items.js"></script>
  <script src="data_recipes.js"></script>
  <script src="data_hints.js"></script>
  <script src="main.js"></script>

</body>
</html>
